name: Thredd
kind: company
description: >-
  Thredd (formerly Global Processing Services / GPS) is a London-headquartered
  issuer-processor and next-generation payments technology company, founded in
  2007, rebranded to Thredd in 2023, and backed by Advent International. It
  provides card issuing and issuer processing for fintechs, neobanks,
  banking-as-a-service platforms, and program managers across Mastercard, Visa,
  and Discover, spanning 40+ countries, with real-time transaction
  authorization (External Host Interface / EHI), digital-wallet tokenization
  (Apple Pay, Google Pay), 3-D Secure / strong customer authentication, card
  controls, and fraud / scam detection. Its home market is the United Kingdom.
  Thredd ships a genuine public developer surface: a self-serve Developer Portal
  (devportal.thredd.com) that grants a sandbox client id and secret, an API Hub
  REST API at api.thredd.com, and a ReadMe-hosted API reference
  (cardsapidocs.thredd.com) documenting roughly 129 endpoints across more than a
  dozen product OpenAPI definitions (core cards, transactions, credit, custom
  PAN, card limits, card controls, digital wallets, 3DS, ACH, open banking,
  alias directory, and web services). Authentication is FAPI-grade OAuth2
  client-credentials using private_key_jwt client assertions over mutual TLS,
  brokered by Cloudentity with Raidiam Connect acting as the certificate
  authority; webhooks and event subscriptions are supported. The underlying
  OpenAPI files render only through the hub and are not anonymously
  downloadable.
